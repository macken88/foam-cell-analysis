[project]
name = "foam-cell-analysis"
version = "0.1.0"
description = "気泡インスタンスセグメンテーションのデータ準備・学習・モデル比較・推論を行うデスクトップアプリ"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyside6>=6.7",
    "numpy>=1.26",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pillow>=10.0",
    "tifffile>=2024.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.3",
    "torchvision>=0.18",
    "cellpose>=3.0",
    "optuna>=3.6",
]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.6",
]

[project.scripts]
foam-cell-analysis = "foam_cell_analysis.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foam_cell_analysis"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
